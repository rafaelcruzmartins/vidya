name: Publicar imagem do add-on

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      # A tag da imagem sai do próprio config.yaml do add-on, para que a
      # versão publicada e a versão que o Home Assistant procura nunca
      # fiquem diferentes.
      - name: Ler a versão do add-on
        id: addon
        run: |
          version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' \
            haos-addon/vidya/config.yaml | head -n1)
          if [ -z "$version" ]; then
            echo "Não foi possível ler o campo 'version' do config.yaml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Versão do add-on: $version"

      - name: Preparar o Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.addon.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.addon.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        run: |
          {
            echo "### Imagem publicada"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository }}:${{ steps.addon.outputs.version }}"
            echo '```'
            echo
            echo "No Home Assistant, o \`config.yaml\` do add-on deve estar com"
            echo "\`version: \"${{ steps.addon.outputs.version }}\"\`."
          } >> "$GITHUB_STEP_SUMMARY"
